name: Monster Ward smoke tests
on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run pure game logic and module tests
        run: npm test
